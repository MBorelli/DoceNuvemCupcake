[project]
name = "doce-nuvem-cupcakes"
version = "1.0.0"
description = "Loja virtual de cupcakes: vitrine, pedido eletrônico, pagamento e entrega (Flask/MVC)"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0",
    "psycopg[binary]>=3.2",
]

[tool.vercel]
# Instância Flask chamada "app" dentro de ./run.py
entrypoint = "run:app"
